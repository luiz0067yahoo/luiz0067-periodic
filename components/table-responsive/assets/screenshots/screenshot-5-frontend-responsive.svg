<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 650" width="1000" height="650">
  <defs>
    <linearGradient id="frontBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="100%" stop-color="#cbd5e1"/>
    </linearGradient>
    <filter id="boxShadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1000" height="650" fill="url(#frontBg)"/>

  <!-- Desktop Browser Mockup -->
  <g filter="url(#boxShadow)" transform="translate(60, 40)">
    <rect width="560" height="560" rx="8" fill="#ffffff"/>
    
    <!-- Browser Top Bar -->
    <path d="M 0 8 Q 0 0 8 0 L 552 0 Q 560 0 560 8 L 560 40 L 0 40 Z" fill="#e2e8f0"/>
    <circle cx="20" cy="20" r="5" fill="#ef4444"/>
    <circle cx="36" cy="20" r="5" fill="#f59e0b"/>
    <circle cx="52" cy="20" r="5" fill="#10b981"/>
    <rect x="75" y="10" width="380" height="20" rx="10" fill="#ffffff"/>
    <text x="95" y="24" fill="#64748b" font-family="sans-serif" font-size="10">https://seusite.com.br/planos-e-tabela</text>

    <!-- Content Desktop -->
    <text x="30" y="75" fill="#0f172a" font-family="sans-serif" font-size="18" font-weight="bold">Frontend — Visualização Desktop</text>
    <text x="30" y="95" fill="#64748b" font-family="sans-serif" font-size="12">Renderização limpa em conformidade total com Bootstrap 5:</text>

    <!-- Table Desktop -->
    <g transform="translate(30, 120)">
      <rect x="0" y="0" width="500" height="38" fill="#212529" rx="4"/>
      <text x="16" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Plano</text>
      <text x="160" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Espaço SSD</text>
      <text x="290" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Tráfego</text>
      <text x="400" y="24" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">Valor</text>

      <!-- Row 1 -->
      <rect x="0" y="38" width="500" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="16" y="64" fill="#1e293b" font-family="sans-serif" font-size="12">Start Pro</text>
      <text x="160" y="64" fill="#475569" font-family="sans-serif" font-size="12">50 GB NVMe</text>
      <text x="290" y="64" fill="#475569" font-family="sans-serif" font-size="12">Ilimitado</text>
      <text x="400" y="64" fill="#0d6efd" font-family="sans-serif" font-size="12" font-weight="bold">R$ 29/mês</text>

      <!-- Row 2 -->
      <rect x="0" y="80" width="500" height="42" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="16" y="106" fill="#1e293b" font-family="sans-serif" font-size="12">Business Ultra</text>
      <text x="160" y="106" fill="#475569" font-family="sans-serif" font-size="12">150 GB NVMe</text>
      <text x="290" y="106" fill="#475569" font-family="sans-serif" font-size="12">Ilimitado</text>
      <text x="400" y="106" fill="#0d6efd" font-family="sans-serif" font-size="12" font-weight="bold">R$ 59/mês</text>

      <!-- Row 3 (Hover state) -->
      <rect x="0" y="122" width="500" height="42" fill="#e2e8f0" stroke="#cbd5e1" stroke-width="0.5"/>
      <text x="16" y="148" fill="#1e293b" font-family="sans-serif" font-size="12" font-weight="600">Enterprise Cloud ★</text>
      <text x="160" y="148" fill="#1e293b" font-family="sans-serif" font-size="12">500 GB NVMe</text>
      <text x="290" y="148" fill="#1e293b" font-family="sans-serif" font-size="12">Dedicado</text>
      <text x="400" y="148" fill="#0d6efd" font-family="sans-serif" font-size="12" font-weight="bold">R$ 149/mês</text>
    </g>
  </g>

  <!-- Mobile Screen Mockup -->
  <g filter="url(#boxShadow)" transform="translate(670, 70)">
    <rect width="270" height="500" rx="32" fill="#1e293b"/>
    <rect x="10" y="10" width="250" height="480" rx="24" fill="#ffffff"/>
    <!-- Speaker & Notch -->
    <rect x="95" y="18" width="80" height="8" rx="4" fill="#334155"/>

    <text x="25" y="60" fill="#0f172a" font-family="sans-serif" font-size="13" font-weight="bold">Mobile Responsivo</text>
    <text x="25" y="78" fill="#64748b" font-family="sans-serif" font-size="10">Scroll horizontal suave via .table-responsive</text>

    <!-- Inner mobile table container -->
    <g transform="translate(20, 95)">
      <rect x="0" y="0" width="230" height="150" fill="#f8fafc" rx="4" stroke="#e2e8f0"/>
      <!-- Table cropped simulating scroll -->
      <rect x="0" y="0" width="230" height="28" fill="#212529" rx="4"/>
      <text x="8" y="18" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Plano</text>
      <text x="75" y="18" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Espaço SSD</text>
      <text x="160" y="18" fill="#ffffff" font-family="sans-serif" font-size="10" font-weight="bold">Tráfego</text>

      <rect x="0" y="28" width="230" height="30" fill="#ffffff" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="8" y="47" fill="#1e293b" font-family="sans-serif" font-size="10">Start Pro</text>
      <text x="75" y="47" fill="#64748b" font-family="sans-serif" font-size="10">50 GB</text>
      <text x="160" y="47" fill="#64748b" font-family="sans-serif" font-size="10">Ilimitado</text>

      <rect x="0" y="58" width="230" height="30" fill="#f8fafc" stroke="#e2e8f0" stroke-width="0.5"/>
      <text x="8" y="77" fill="#1e293b" font-family="sans-serif" font-size="10">Business</text>
      <text x="75" y="77" fill="#64748b" font-family="sans-serif" font-size="10">150 GB</text>
      <text x="160" y="77" fill="#64748b" font-family="sans-serif" font-size="10">Ilimitado</text>

      <!-- Scroll indicator arrow -->
      <rect x="180" y="105" width="40" height="22" rx="11" fill="#0d6efd" opacity="0.9"/>
      <text x="194" y="120" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">→</text>
    </g>

    <text x="25" y="285" fill="#166534" font-family="sans-serif" font-size="10" font-weight="600">✓ 100% Touch Friendly</text>
    <text x="25" y="302" fill="#64748b" font-family="sans-serif" font-size="10">Sem quebra de layout em smartphones.</text>
  </g>
</svg>
