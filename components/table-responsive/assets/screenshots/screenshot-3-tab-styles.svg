<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Main Container -->
  <g filter="url(#shadow)" transform="translate(180, 40)">
    <rect width="440" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 430 0 Q 440 0 440 10 L 440 56 L 0 56 Z" fill="#0f172a"/>
    <circle cx="32" cy="28" r="10" fill="#0d6efd"/>
    <text x="52" y="33" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Aba: Estilos Bootstrap 5</text>

    <!-- Sub Header Tabs -->
    <rect x="0" y="56" width="440" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="146" y="56" width="146" height="42" fill="#ffffff"/>
    <rect x="146" y="96" width="146" height="2" fill="#0d6efd"/>
    <text x="44" y="82" fill="#64748b" font-family="sans-serif" font-size="12">Estrutura</text>
    <text x="170" y="82" fill="#0d6efd" font-family="sans-serif" font-size="12" font-weight="bold">Estilos</text>
    <text x="330" y="82" fill="#64748b" font-family="sans-serif" font-size="12">Cores</text>

    <!-- Tab Content -->
    <text x="28" y="130" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="bold">Opções Nativas Bootstrap</text>
    <text x="28" y="152" fill="#64748b" font-family="sans-serif" font-size="12">Ative ou desative modificadores CSS do framework.</text>

    <!-- Toggle 1: Striped -->
    <rect x="28" y="175" width="384" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="200" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">Linhas Alternadas (.table-striped)</text>
    <text x="44" y="222" fill="#64748b" font-family="sans-serif" font-size="11">Cria contraste zebrado para facilitar leitura de dados extensos.</text>
    <!-- Switch ON -->
    <rect x="340" y="195" width="48" height="24" rx="12" fill="#0d6efd"/>
    <circle cx="372" cy="207" r="9" fill="#ffffff"/>

    <!-- Toggle 2: Hover -->
    <rect x="28" y="255" width="384" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="280" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">Efeito ao Passar o Mouse (.table-hover)</text>
    <text x="44" y="302" fill="#64748b" font-family="sans-serif" font-size="11">Destaca dinamicamente a linha em foco pelo usuário.</text>
    <!-- Switch ON -->
    <rect x="340" y="275" width="48" height="24" rx="12" fill="#0d6efd"/>
    <circle cx="372" cy="287" r="9" fill="#ffffff"/>

    <!-- Toggle 3: Bordered -->
    <rect x="28" y="335" width="384" height="66" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="360" fill="#1e293b" font-family="sans-serif" font-size="13" font-weight="bold">Bordas Completas (.table-bordered)</text>
    <text x="44" y="382" fill="#64748b" font-family="sans-serif" font-size="11">Adiciona linhas de grade nítidas ao redor de todas as células.</text>
    <!-- Switch ON -->
    <rect x="340" y="355" width="48" height="24" rx="12" fill="#0d6efd"/>
    <circle cx="372" cy="367" r="9" fill="#ffffff"/>

    <!-- Responsive Container Note -->
    <rect x="28" y="420" width="384" height="70" rx="6" fill="#e0f2fe" stroke="#7dd3fc"/>
    <text x="44" y="445" fill="#0369a1" font-family="sans-serif" font-size="12" font-weight="bold">Container Responsivo Automático</text>
    <text x="44" y="468" fill="#0284c7" font-family="sans-serif" font-size="11">A tabela é sempre encapsulada em .table-responsive para mobile.</text>
  </g>
</svg>
