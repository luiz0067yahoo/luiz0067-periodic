<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <filter id="shadow" x="-5%" y="-5%" width="110%" height="115%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000000" flood-opacity="0.15"/>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#bg)"/>

  <!-- Main Container -->
  <g filter="url(#shadow)" transform="translate(180, 40)">
    <rect width="440" height="520" rx="10" fill="#ffffff" stroke="#e2e8f0"/>

    <!-- Header -->
    <path d="M 0 10 Q 0 0 10 0 L 430 0 Q 440 0 440 10 L 440 56 L 0 56 Z" fill="#0f172a"/>
    <circle cx="32" cy="28" r="10" fill="#0d6efd"/>
    <text x="52" y="33" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="15" font-weight="bold">Aba: Estrutura da Tabela</text>

    <!-- Sub Header Tabs -->
    <rect x="0" y="56" width="440" height="42" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
    <rect x="0" y="56" width="146" height="42" fill="#ffffff"/>
    <rect x="0" y="96" width="146" height="2" fill="#0d6efd"/>
    <text x="24" y="82" fill="#0d6efd" font-family="sans-serif" font-size="12" font-weight="bold">Estrutura</text>
    <text x="180" y="82" fill="#64748b" font-family="sans-serif" font-size="12">Estilos</text>
    <text x="330" y="82" fill="#64748b" font-family="sans-serif" font-size="12">Cores</text>

    <!-- Tab Content -->
    <text x="28" y="130" fill="#1e293b" font-family="sans-serif" font-size="14" font-weight="bold">Gerenciar Linhas e Colunas</text>
    <text x="28" y="152" fill="#64748b" font-family="sans-serif" font-size="12">Insira ou remova linhas e colunas com 1 clique.</text>

    <!-- Linhas Group -->
    <rect x="28" y="180" width="384" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="206" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">LINHAS (Total: 4)</text>
    <rect x="44" y="222" width="168" height="36" rx="4" fill="#0d6efd"/>
    <text x="64" y="245" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">+ Adicionar Linha</text>
    <rect x="222" y="222" width="176" height="36" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="260" y="245" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">Excluir Linha</text>

    <!-- Colunas Group -->
    <rect x="28" y="295" width="384" height="96" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
    <text x="44" y="321" fill="#334155" font-family="sans-serif" font-size="12" font-weight="bold">COLUNAS (Total: 3)</text>
    <rect x="44" y="337" width="168" height="36" rx="4" fill="#0d6efd"/>
    <text x="58" y="360" fill="#ffffff" font-family="sans-serif" font-size="12" font-weight="bold">+ Adicionar Coluna</text>
    <rect x="222" y="337" width="176" height="36" rx="4" fill="#fee2e2" stroke="#fca5a5"/>
    <text x="252" y="360" fill="#dc2626" font-family="sans-serif" font-size="12" font-weight="bold">Excluir Coluna</text>

    <!-- Reset Group -->
    <rect x="28" y="415" width="384" height="50" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
    <circle cx="50" cy="440" r="10" fill="#3b82f6"/>
    <text x="46" y="444" fill="#ffffff" font-family="sans-serif" font-size="11" font-weight="bold">↻</text>
    <text x="70" y="445" fill="#1e40af" font-family="sans-serif" font-size="12" font-weight="600">Restaurar Tabela de Exemplo Padrão</text>
  </g>
</svg>
