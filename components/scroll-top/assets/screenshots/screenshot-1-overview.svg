<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 680" width="1200" height="680">
  <defs>
    <style>
      .bg { fill: #f0f2f5; }
      .nav { fill: #1e1e1e; }
      .sidebar { fill: #ffffff; stroke: #e0e0e0; stroke-width: 1; }
      .card { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; rx: 8; }
      .header-bg { fill: #f8f9fa; rx: 8; }
      .btn-circle { fill: #0d6efd; filter: drop-shadow(0 6px 14px rgba(13, 110, 253, 0.35)); }
      .btn-floating { fill: #0d6efd; filter: drop-shadow(0 8px 20px rgba(0,0,0,0.25)); }
      .tab-active { fill: #0d6efd; font-weight: bold; }
      .text-title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 700; fill: #212529; font-size: 17px; }
      .text-sub { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #6c757d; font-size: 13px; }
      .text-body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #343a40; font-size: 14px; }
      .code-badge { fill: #e7f1ff; stroke: #b6d4fe; rx: 4; }
      .code-badge-text { font-family: monospace; fill: #0d6efd; font-size: 12px; font-weight: bold; }
    </style>
  </defs>

  <!-- Fundo do Editor -->
  <rect width="1200" height="680" class="bg"/>

  <!-- Barra Superior do WordPress Admin -->
  <rect width="1200" height="52" class="nav"/>
  <circle cx="28" cy="26" r="14" fill="#3858e9"/>
  <path d="M21 26 L26 21 L35 30" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <text x="56" y="32" font-family="sans-serif" font-size="15" fill="#ffffff" font-weight="600">WordPress &bull; Editar Página</text>
  <rect x="1060" y="11" width="115" height="30" rx="4" fill="#0d6efd"/>
  <text x="1092" y="31" font-family="sans-serif" font-size="13" fill="#ffffff" font-weight="bold">Publicar</text>

  <!-- Área de Conteúdo / Canvas do Gutenberg -->
  <g transform="translate(60, 90)">
    <!-- Simulação do Card no Canvas -->
    <rect width="720" height="340" class="card"/>
    <rect width="720" height="64" class="header-bg"/>
    <circle cx="36" cy="32" r="18" fill="#0d6efd"/>
    <path d="M30 35 L36 29 L42 35" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>
    <text x="68" y="28" class="text-title">Bloco: Voltar ao Topo (Scroll Top)</text>
    <text x="68" y="47" class="text-sub">Configurado com animação suave e Bootstrap 5</text>

    <rect x="580" y="18" width="115" height="26" class="code-badge"/>
    <text x="590" y="35" class="code-badge-text">Inferior Direito</text>

    <!-- Caixa de Aviso Informativo -->
    <rect x="24" y="80" width="672" height="58" rx="6" fill="#cff4fc" stroke="#b6effb"/>
    <text x="40" y="105" font-family="sans-serif" font-size="13" fill="#055160" font-weight="bold">Nota do Desenvolvedor:</text>
    <text x="40" y="125" font-family="sans-serif" font-size="12.5" fill="#055160">Este bloco funciona de maneira flutuante. O botão permanecerá oculto até que o visitante role 300px da página.</text>

    <!-- Preview Central no Card -->
    <rect x="24" y="155" width="260" height="155" rx="6" fill="#f8f9fa" stroke="#e9ecef"/>
    <text x="75" y="180" class="text-sub">Pré-visualização do Botão</text>
    <circle cx="154" cy="225" r="28" class="btn-circle"/>
    <path d="M146 228 L154 220 L162 228" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
    <text x="96" y="280" font-family="sans-serif" font-size="12" fill="#6c757d">48x48px &bull; circle &bull; #0d6efd</text>

    <!-- Resumo de Configurações -->
    <g transform="translate(315, 160)">
      <text x="0" y="15" class="text-title" font-size="14">Resumo das Configurações:</text>
      <text x="0" y="45" class="text-body">&bull; <tspan font-weight="bold">Posicionamento:</tspan> Canto inferior direito (24px x 24px)</text>
      <text x="0" y="75" class="text-body">&bull; <tspan font-weight="bold">Gatilho de Ativação:</tspan> 300px de rolagem vertical</text>
      <text x="0" y="105" class="text-body">&bull; <tspan font-weight="bold">Cores:</tspan> Fundo #0d6efd / Ícone #ffffff</text>
      <text x="0" y="135" class="text-body">&bull; <tspan font-weight="bold">Acessibilidade:</tspan> "Voltar ao topo" (aria-label)</text>
    </g>
  </g>

  <!-- Botão Flutuante ao Vivo (Preview no Canto da Tela) -->
  <g transform="translate(730, 580)">
    <circle cx="28" cy="28" r="26" class="btn-floating"/>
    <path d="M20 31 L28 23 L36 31" stroke="#ffffff" stroke-width="3.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Barra Lateral do InspectorControls (Painel Direito) -->
  <g transform="translate(830, 52)">
    <rect width="370" height="628" class="sidebar"/>
    
    <!-- Cabeçalho das Abas -->
    <rect width="370" height="42" fill="#f8f9fa" stroke="#e0e0e0"/>
    <rect x="0" y="0" width="123" height="42" fill="#ffffff"/>
    <rect x="0" y="40" width="123" height="2" fill="#0d6efd"/>
    <text x="14" y="26" class="tab-active" font-size="12">Posicionamento</text>

    <text x="156" y="26" class="text-sub" font-size="12">Aparência</text>
    <text x="256" y="26" class="text-sub" font-size="12">Gatilho de Rolagem</text>

    <!-- Conteúdo da Aba -->
    <g transform="translate(20, 65)">
      <text x="0" y="18" class="text-title" font-size="15">Configurações de Posicionamento</text>
      
      <text x="0" y="55" class="text-sub" font-weight="bold">POSIÇÃO NA TELA</text>
      <rect x="0" y="65" width="330" height="36" rx="4" fill="#ffffff" stroke="#8c8f94"/>
      <text x="12" y="88" class="text-body">Canto Inferior Direito</text>
      <path d="M305 82 L312 90 L319 82" stroke="#495057" stroke-width="2" fill="none"/>

      <text x="0" y="135" class="text-sub" font-weight="bold">DISTÂNCIA HORIZONTAL (PX)</text>
      <line x1="0" y1="155" x2="280" y2="155" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
      <line x1="120" y1="155" x2="330" y2="155" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="155" r="8" fill="#0d6efd"/>
      <text x="305" y="145" class="text-body" font-weight="bold">24px</text>

      <text x="0" y="205" class="text-sub" font-weight="bold">DISTÂNCIA INFERIOR (PX)</text>
      <line x1="0" y1="225" x2="280" y2="225" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
      <line x1="120" y1="225" x2="330" y2="225" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
      <circle cx="120" cy="225" r="8" fill="#0d6efd"/>
      <text x="305" y="215" class="text-body" font-weight="bold">24px</text>

      <text x="0" y="275" class="text-sub" font-weight="bold">ORDEM DE CAMADA (Z-INDEX)</text>
      <line x1="0" y1="295" x2="280" y2="295" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
      <circle cx="280" cy="295" r="8" fill="#0d6efd"/>
      <text x="290" y="285" class="text-body" font-weight="bold">9999</text>
    </g>
  </g>
</svg>
