<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 540" width="420" height="540">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .tab-bar { fill: #f8f9fa; stroke: #e0e0e0; stroke-width: 1; }
      .tab-active { fill: #0d6efd; font-weight: bold; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; fill: #1e1e1e; font-size: 15px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #495057; font-size: 12px; }
      .help { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #6c757d; font-size: 11px; }
      .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #212529; font-size: 13px; }
    </style>
  </defs>

  <rect width="420" height="540" class="bg"/>

  <!-- Abas de Navegação -->
  <rect width="420" height="42" class="tab-bar"/>
  <rect x="280" y="0" width="140" height="42" fill="#ffffff"/>
  <rect x="280" y="40" width="140" height="2" fill="#0d6efd"/>
  <text x="24" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Posicionamento</text>
  <text x="170" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Aparência</text>
  <text x="296" y="26" font-family="sans-serif" font-size="12" class="tab-active">Gatilho de Rolagem</text>

  <g transform="translate(24, 65)">
    <text x="0" y="16" class="title">Gatilho de Rolagem e Acessibilidade</text>

    <!-- Range Scroll Offset -->
    <text x="0" y="52" class="label">DISTÂNCIA DE ROLAGEM PARA EXIBIR (PX)</text>
    <rect x="320" y="36" width="52" height="26" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="330" y="54" class="val" font-weight="bold">300</text>
    <line x1="0" y1="80" x2="372" y2="80" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="80" x2="105" y2="80" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="105" cy="80" r="8" fill="#0d6efd"/>
    <text x="0" y="104" class="help">Quantidade de pixels que o visitante precisa rolar a página</text>
    <text x="0" y="120" class="help">para que o botão surja suavemente.</text>

    <!-- Campo aria-label -->
    <text x="0" y="160" class="label">TEXTO ACESSÍVEL (ARIA-LABEL)</text>
    <rect x="0" y="170" width="372" height="38" rx="4" fill="#ffffff" stroke="#8c8f94"/>
    <text x="12" y="194" class="val">Voltar ao topo</text>
    <text x="0" y="226" class="help">Descrição lida por leitores de tela para visitantes com deficiência.</text>

    <!-- Toggle Preview -->
    <g transform="translate(0, 260)">
      <text x="0" y="16" class="label">EXIBIR PREVIEW FLUTUANTE NO EDITOR</text>
      <!-- Toggle Switch Ativo -->
      <rect x="320" y="2" width="48" height="24" rx="12" fill="#0d6efd"/>
      <circle cx="356" cy="14" r="9" fill="#ffffff"/>
      <text x="0" y="44" class="help">Simula a posição exata e aparência que o visitante terá no site.</text>
    </g>

    <!-- Dica de Desempenho -->
    <rect x="0" y="340" width="372" height="70" rx="6" fill="#e8f5e9" stroke="#c8e6c9"/>
    <text x="16" y="365" font-family="sans-serif" font-size="12" fill="#2e7d32" font-weight="bold">Alta Performance (Vanilla JS):</text>
    <text x="16" y="385" font-family="sans-serif" font-size="11.5" fill="#2e7d32">Monitorado via requestAnimationFrame nativo sem travamentos</text>
    <text x="16" y="400" font-family="sans-serif" font-size="11.5" fill="#2e7d32">de rolagem (Zero dependências pesadas de jQuery).</text>
  </g>
</svg>
