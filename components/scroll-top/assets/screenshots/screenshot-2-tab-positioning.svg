<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 560" width="420" height="560">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .tab-bar { fill: #f8f9fa; stroke: #e0e0e0; stroke-width: 1; }
      .tab-active { fill: #0d6efd; font-weight: bold; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; fill: #1e1e1e; font-size: 15px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #495057; font-size: 12px; }
      .help { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #6c757d; font-size: 11px; }
      .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #212529; font-size: 13px; }
    </style>
  </defs>

  <rect width="420" height="560" class="bg"/>

  <!-- Abas de Navegação -->
  <rect width="420" height="42" class="tab-bar"/>
  <rect x="0" y="0" width="140" height="42" fill="#ffffff"/>
  <rect x="0" y="40" width="140" height="2" fill="#0d6efd"/>
  <text x="24" y="26" font-family="sans-serif" font-size="12" class="tab-active">Posicionamento</text>
  <text x="178" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Aparência</text>
  <text x="286" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Gatilho</text>

  <g transform="translate(24, 65)">
    <text x="0" y="16" class="title">Configurações de Posicionamento</text>

    <!-- Campo Posição -->
    <text x="0" y="52" class="label">POSIÇÃO NA TELA</text>
    <rect x="0" y="62" width="372" height="38" rx="4" fill="#ffffff" stroke="#8c8f94"/>
    <text x="12" y="86" class="val">Canto Inferior Direito</text>
    <path d="M346 80 L352 86 L358 80" stroke="#495057" stroke-width="2" fill="none"/>
    <text x="0" y="116" class="help">Define o canto da página onde o botão ficará fixado.</text>

    <!-- Range Offset X -->
    <text x="0" y="152" class="label">DISTÂNCIA HORIZONTAL (PX)</text>
    <rect x="330" y="136" width="42" height="26" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="342" y="154" class="val" font-weight="bold">24</text>
    <line x1="0" y1="180" x2="372" y2="180" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="180" x2="85" y2="180" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="180" r="8" fill="#0d6efd"/>
    <text x="0" y="204" class="help">Distância da lateral da tela (direita ou esquerda).</text>

    <!-- Range Offset Y -->
    <text x="0" y="242" class="label">DISTÂNCIA INFERIOR (PX)</text>
    <rect x="330" y="226" width="42" height="26" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="342" y="244" class="val" font-weight="bold">24</text>
    <line x1="0" y1="270" x2="372" y2="270" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="270" x2="85" y2="270" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="85" cy="270" r="8" fill="#0d6efd"/>
    <text x="0" y="294" class="help">Distância da margem inferior da janela.</text>

    <!-- Range Z-Index -->
    <text x="0" y="332" class="label">ORDEM DE CAMADA (Z-INDEX)</text>
    <rect x="315" y="316" width="57" height="26" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="323" y="334" class="val" font-weight="bold">9999</text>
    <line x1="0" y1="360" x2="372" y2="360" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="360" x2="310" y2="360" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="310" cy="360" r="8" fill="#0d6efd"/>
    <text x="0" y="384" class="help">Garante que o botão flutuante fique acima de outros elementos.</text>
  </g>
</svg>
