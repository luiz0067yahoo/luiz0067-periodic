<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 620" width="420" height="620">
  <defs>
    <style>
      .bg { fill: #ffffff; stroke: #dee2e6; stroke-width: 1; }
      .tab-bar { fill: #f8f9fa; stroke: #e0e0e0; stroke-width: 1; }
      .tab-active { fill: #0d6efd; font-weight: bold; }
      .title { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: bold; fill: #1e1e1e; font-size: 15px; }
      .label { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-weight: 600; fill: #495057; font-size: 12px; }
      .help { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #6c757d; font-size: 11px; }
      .val { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #212529; font-size: 13px; }
      .icon-box { fill: #ffffff; stroke: #ced4da; rx: 6; }
      .icon-box.active { fill: #0d6efd; stroke: #0d6efd; }
    </style>
  </defs>

  <rect width="420" height="620" class="bg"/>

  <!-- Abas de Navegação -->
  <rect width="420" height="42" class="tab-bar"/>
  <rect x="140" y="0" width="140" height="42" fill="#ffffff"/>
  <rect x="140" y="40" width="140" height="2" fill="#0d6efd"/>
  <text x="24" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Posicionamento</text>
  <text x="180" y="26" font-family="sans-serif" font-size="12" class="tab-active">Aparência</text>
  <text x="296" y="26" font-family="sans-serif" font-size="12" fill="#6c757d">Gatilho</text>

  <g transform="translate(24, 65)">
    <text x="0" y="16" class="title">Customização Visual</text>

    <!-- Formato -->
    <text x="0" y="50" class="label">FORMATO DO BOTÃO</text>
    <rect x="0" y="58" width="372" height="38" rx="4" fill="#ffffff" stroke="#8c8f94"/>
    <text x="12" y="82" class="val">Círculo (Circular)</text>
    <path d="M346 76 L352 82 L358 76" stroke="#495057" stroke-width="2" fill="none"/>

    <!-- Tamanho do Botão -->
    <text x="0" y="125" class="label">TAMANHO DO BOTÃO (PX)</text>
    <rect x="330" y="108" width="42" height="26" rx="3" fill="#f8f9fa" stroke="#ced4da"/>
    <text x="342" y="126" class="val" font-weight="bold">48</text>
    <line x1="0" y1="145" x2="372" y2="145" stroke="#dee2e6" stroke-width="4" stroke-linecap="round"/>
    <line x1="0" y1="145" x2="130" y2="145" stroke="#0d6efd" stroke-width="4" stroke-linecap="round"/>
    <circle cx="130" cy="145" r="8" fill="#0d6efd"/>

    <!-- Seletor de Cores -->
    <text x="0" y="185" class="label">COR DE FUNDO</text>
    <g transform="translate(0, 195)">
      <circle cx="14" cy="14" r="13" fill="#0d6efd" stroke="#000" stroke-width="2"/>
      <circle cx="50" cy="14" r="13" fill="#212529"/>
      <circle cx="86" cy="14" r="13" fill="#198754"/>
      <circle cx="122" cy="14" r="13" fill="#dc3545"/>
      <circle cx="158" cy="14" r="13" fill="#0dcaf0"/>
      <circle cx="194" cy="14" r="13" fill="#6610f2"/>
      <circle cx="230" cy="14" r="13" fill="#6f42c1"/>
      <circle cx="266" cy="14" r="13" fill="#ffffff" stroke="#ccc"/>
    </g>

    <text x="0" y="255" class="label">COR DO ÍCONE</text>
    <g transform="translate(0, 265)">
      <circle cx="14" cy="14" r="13" fill="#ffffff" stroke="#000" stroke-width="2"/>
      <circle cx="50" cy="14" r="13" fill="#212529"/>
      <circle cx="86" cy="14" r="13" fill="#0d6efd"/>
      <circle cx="122" cy="14" r="13" fill="#f8f9fa" stroke="#ccc"/>
    </g>

    <!-- Seleção Rápida de Ícone -->
    <text x="0" y="325" class="label">SELEÇÃO RÁPIDA DE ÍCONE</text>
    <g transform="translate(0, 335)">
      <!-- Ícone 1 (Ativo) -->
      <rect x="0" y="0" width="80" height="42" class="icon-box active"/>
      <path d="M34 24 L40 18 L46 24" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round"/>

      <!-- Ícone 2 -->
      <rect x="90" y="0" width="80" height="42" class="icon-box"/>
      <path d="M125 24 L130 18 L135 24 M130 18 L130 30" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Ícone 3 -->
      <rect x="180" y="0" width="80" height="42" class="icon-box"/>
      <path d="M214 22 L220 16 L226 22 M214 28 L220 22 L226 28" stroke="#333" stroke-width="2" fill="none" stroke-linecap="round"/>

      <!-- Ícone 4 -->
      <rect x="270" y="0" width="80" height="42" class="icon-box"/>
      <polygon points="310,18 318,30 302,30" fill="#333"/>
    </g>

    <!-- Campo Classe Font Awesome -->
    <text x="0" y="415" class="label">CLASSE CSS DO ÍCONE FONT AWESOME</text>
    <rect x="0" y="425" width="372" height="38" rx="4" fill="#ffffff" stroke="#8c8f94"/>
    <text x="12" y="449" class="val">fas fa-chevron-up</text>
    <text x="0" y="480" class="help">Ex: fas fa-chevron-up, fas fa-arrow-up, fas fa-rocket</text>
  </g>
</svg>
