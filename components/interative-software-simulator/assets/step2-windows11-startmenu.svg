<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="win11-bg2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071228"/>
      <stop offset="35%" stop-color="#0f2652"/>
      <stop offset="70%" stop-color="#163f75"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <filter id="menu-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.65"/>
    </filter>
  </defs>

  <!-- Wallpaper Background (Dimmed slightly) -->
  <rect width="1920" height="1080" fill="url(#win11-bg2)"/>
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.3"/>

  <!-- Desktop Icons (Faded) -->
  <g opacity="0.4">
    <rect x="50" y="52" width="30" height="34" rx="4" fill="#60a5fa" fill-opacity="0.3" stroke="#93c5fd" stroke-width="2"/>
    <rect x="48" y="150" width="34" height="24" rx="3" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
  </g>

  <!-- START MENU FLYOUT (Centered) -->
  <g id="start-menu-flyout" filter="url(#menu-shadow)">
    <!-- Main Modal Container -->
    <rect x="640" y="290" width="640" height="720" rx="14" fill="#202738" fill-opacity="0.95" stroke="#ffffff" stroke-opacity="0.15" stroke-width="1.5"/>

    <!-- Search Bar (HOTSPOT TARGET FOR INPUT) -->
    <g id="search-bar-container">
      <rect x="680" y="325" width="560" height="46" rx="8" fill="#151b27" stroke="#3b82f6" stroke-width="1.5"/>
      <circle cx="705" cy="348" r="8" stroke="#94a3b8" stroke-width="2" fill="none"/>
      <line x1="711" y1="354" x2="718" y2="361" stroke="#94a3b8" stroke-width="2" stroke-linecap="round"/>
      <text x="732" y="354" fill="#64748b" font-family="'Segoe UI', Roboto, sans-serif" font-size="15">Digite aqui para pesquisar...</text>
    </g>

    <!-- Fixados / Pinned Header -->
    <text x="680" y="415" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Fixados</text>
    <rect x="1150" y="400" width="90" height="26" rx="4" fill="#2d3748" fill-opacity="0.5"/>
    <text x="1195" y="418" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Todos os apps &gt;</text>

    <!-- Pinned Apps Grid (3 rows x 6 cols) -->
    <!-- Row 1 -->
    <!-- Edge -->
    <g transform="translate(680, 435)">
      <circle cx="28" cy="24" r="16" fill="#0284c7"/>
      <text x="28" y="56" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Edge</text>
    </g>
    <!-- Word (Highlighted) -->
    <g transform="translate(775, 435)">
      <rect x="12" y="8" width="32" height="32" rx="4" fill="#185abd"/>
      <text x="28" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">W</text>
      <text x="28" y="56" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle" font-weight="600">Word</text>
    </g>
    <!-- Excel -->
    <g transform="translate(870, 435)">
      <rect x="12" y="8" width="32" height="32" rx="4" fill="#107c41"/>
      <text x="28" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">X</text>
      <text x="28" y="56" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Excel</text>
    </g>
    <!-- PowerPoint -->
    <g transform="translate(965, 435)">
      <rect x="12" y="8" width="32" height="32" rx="4" fill="#c43e1c"/>
      <text x="28" y="32" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="18" font-weight="bold" text-anchor="middle">P</text>
      <text x="28" y="56" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">PowerPoint</text>
    </g>
    <!-- Configurações -->
    <g transform="translate(1060, 435)">
      <circle cx="28" cy="24" r="16" fill="#475569"/>
      <text x="28" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" text-anchor="middle">⚙</text>
      <text x="28" y="56" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Ajustes</text>
    </g>
    <!-- Arquivos -->
    <g transform="translate(1155, 435)">
      <rect x="12" y="10" width="32" height="28" rx="4" fill="#ca8a04"/>
      <text x="28" y="56" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Arquivos</text>
    </g>

    <!-- Recomendados Section -->
    <text x="680" y="550" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Recomendados</text>
    <rect x="1180" y="535" width="60" height="26" rx="4" fill="#2d3748" fill-opacity="0.5"/>
    <text x="1210" y="553" fill="#cbd5e1" font-family="'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle">Mais &gt;</text>

    <!-- Recent items list -->
    <g transform="translate(680, 575)">
      <rect x="0" y="0" width="260" height="48" rx="6" fill="#2d3748" fill-opacity="0.3"/>
      <rect x="10" y="8" width="32" height="32" rx="4" fill="#185abd"/>
      <text x="26" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">W</text>
      <text x="52" y="24" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500">Trabalho Academico.docx</text>
      <text x="52" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Há 15 minutos</text>
    </g>

    <g transform="translate(980, 575)">
      <rect x="0" y="0" width="260" height="48" rx="6" fill="#2d3748" fill-opacity="0.3"/>
      <rect x="10" y="8" width="32" height="32" rx="4" fill="#107c41"/>
      <text x="26" y="30" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="16" font-weight="bold" text-anchor="middle">X</text>
      <text x="52" y="24" fill="#f1f5f9" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="500">Planilha Custos.xlsx</text>
      <text x="52" y="40" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11">Ontem às 18:30</text>
    </g>

    <!-- Footer of Start Menu: User & Power -->
    <line x1="640" y1="945" x2="1280" y2="945" stroke="#ffffff" stroke-opacity="0.1"/>
    <!-- User -->
    <circle cx="705" cy="978" r="18" fill="#3b82f6"/>
    <text x="705" y="984" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="15" font-weight="bold" text-anchor="middle">U</text>
    <text x="735" y="983" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="500">Usuário do Windows</text>
    <!-- Power Button -->
    <circle cx="1235" cy="978" r="18" fill="none" stroke="#cbd5e1" stroke-width="1.5"/>
    <path d="M 1235 968 L 1235 976 M 1231 971 A 8 8 0 1 0 1239 971" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Taskbar Windows 11 (Centered) -->
  <rect x="0" y="1032" width="1920" height="48" fill="#181e28" fill-opacity="0.98"/>
  <g id="taskbar-icons-s2" transform="translate(860, 1034)">
    <rect x="0" y="2" width="44" height="40" rx="6" fill="#3b82f6" fill-opacity="0.3"/>
    <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#60a5fa"/>
    <rect x="22" y="12" width="8" height="8" rx="1.5" fill="#60a5fa"/>
    <rect x="12" y="22" width="8" height="8" rx="1.5" fill="#60a5fa"/>
    <rect x="22" y="22" width="8" height="8" rx="1.5" fill="#60a5fa"/>
  </g>
</svg>
