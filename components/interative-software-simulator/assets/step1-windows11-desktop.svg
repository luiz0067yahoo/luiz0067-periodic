<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="win11-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b1b3d"/>
      <stop offset="35%" stop-color="#153675"/>
      <stop offset="70%" stop-color="#1f5aa6"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="bloom1" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#60a5fa" stop-opacity="0.8"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#1d4ed8" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Wallpaper Background -->
  <rect width="1920" height="1080" fill="url(#win11-bg)"/>
  
  <!-- Stylized Win11 Bloom Shapes -->
  <path d="M 700 750 C 650 500, 850 320, 1050 420 C 1250 520, 1400 700, 1200 850 C 1050 950, 750 900, 700 750 Z" fill="url(#bloom1)" filter="url(#shadow)"/>
  <path d="M 850 680 C 780 520, 920 380, 1100 450 C 1220 500, 1300 640, 1180 780 C 1080 900, 900 820, 850 680 Z" fill="#93c5fd" fill-opacity="0.45"/>
  <path d="M 920 620 C 880 500, 980 430, 1080 480 C 1180 530, 1200 650, 1120 740 C 1050 820, 950 720, 920 620 Z" fill="#ffffff" fill-opacity="0.35"/>

  <!-- Desktop Icons -->
  <!-- Lixeira -->
  <g transform="translate(30, 30)">
    <rect width="70" height="70" rx="10" fill="none"/>
    <rect x="20" y="22" width="30" height="34" rx="4" fill="#60a5fa" fill-opacity="0.3" stroke="#93c5fd" stroke-width="2"/>
    <line x1="28" y1="30" x2="28" y2="48" stroke="#ffffff" stroke-width="2"/>
    <line x1="35" y1="30" x2="35" y2="48" stroke="#ffffff" stroke-width="2"/>
    <line x1="42" y1="30" x2="42" y2="48" stroke="#ffffff" stroke-width="2"/>
    <path d="M 16 22 L 54 22 M 30 17 L 40 17" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <text x="35" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Lixeira</text>
  </g>

  <!-- Este Computador -->
  <g transform="translate(30, 130)">
    <rect width="70" height="70" rx="10" fill="none"/>
    <rect x="18" y="20" width="34" height="24" rx="3" fill="#3b82f6" stroke="#93c5fd" stroke-width="2"/>
    <rect x="22" y="24" width="26" height="16" fill="#1e3a8a"/>
    <path d="M 32 46 L 38 46 M 26 50 L 44 50" stroke="#93c5fd" stroke-width="2" stroke-linecap="round"/>
    <text x="35" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Este Computador</text>
  </g>

  <!-- Google Chrome -->
  <g transform="translate(30, 230)">
    <circle cx="35" cy="36" r="18" fill="#ffffff"/>
    <circle cx="35" cy="36" r="16" fill="#ea4335"/>
    <path d="M 35 36 L 51 36 A 16 16 0 0 1 27 50 Z" fill="#fbbc05"/>
    <path d="M 35 36 L 27 50 A 16 16 0 0 1 23 26 Z" fill="#34a853"/>
    <circle cx="35" cy="36" r="8" fill="#ffffff"/>
    <circle cx="35" cy="36" r="6" fill="#4285f4"/>
    <text x="35" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Google Chrome</text>
  </g>

  <!-- Microsoft Word Shortcut -->
  <g transform="translate(30, 330)">
    <rect x="18" y="18" width="34" height="36" rx="4" fill="#185abd"/>
    <text x="35" y="44" fill="#ffffff" font-family="'Segoe UI', Roboto, sans-serif" font-size="22" font-weight="bold" text-anchor="middle">W</text>
    <text x="35" y="76" fill="#ffffff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" text-anchor="middle" font-weight="500">Word</text>
  </g>

  <!-- Taskbar Windows 11 (Centered) -->
  <rect x="0" y="1032" width="1920" height="48" fill="#181e28" fill-opacity="0.88"/>
  <rect x="0" y="1031" width="1920" height="1" fill="#ffffff" fill-opacity="0.12"/>

  <!-- Left Widgets Weather -->
  <g transform="translate(24, 1042)">
    <circle cx="14" cy="14" r="8" fill="#fbbf24"/>
    <path d="M 12 18 A 6 6 0 0 1 24 16 A 5 5 0 0 1 30 20 L 10 20 Z" fill="#e2e8f0"/>
    <text x="38" y="18" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="13">24°C Ensolarado</text>
  </g>

  <!-- Center Taskbar Icons -->
  <g id="taskbar-icons" transform="translate(860, 1034)">
    <!-- Start Button (HOTSPOT TARGET) -->
    <g id="start-button-area">
      <rect x="0" y="2" width="44" height="40" rx="6" fill="#ffffff" fill-opacity="0.08"/>
      <!-- Win11 Start Icon (4 blue tiles) -->
      <rect x="12" y="12" width="8" height="8" rx="1.5" fill="#0078d4"/>
      <rect x="22" y="12" width="8" height="8" rx="1.5" fill="#0078d4"/>
      <rect x="12" y="22" width="8" height="8" rx="1.5" fill="#0078d4"/>
      <rect x="22" y="22" width="8" height="8" rx="1.5" fill="#0078d4"/>
    </g>

    <!-- Search Icon -->
    <g transform="translate(48, 0)">
      <circle cx="21" cy="20" r="7" stroke="#cbd5e1" stroke-width="2" fill="none"/>
      <line x1="26" y1="25" x2="31" y2="30" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round"/>
    </g>

    <!-- Task View -->
    <g transform="translate(94, 0)">
      <rect x="12" y="14" width="12" height="14" rx="2" stroke="#cbd5e1" stroke-width="2" fill="none"/>
      <rect x="18" y="18" width="12" height="14" rx="2" stroke="#94a3b8" stroke-width="2" fill="none"/>
    </g>

    <!-- File Explorer -->
    <g transform="translate(140, 0)">
      <rect x="11" y="15" width="22" height="18" rx="3" fill="#eab308"/>
      <rect x="11" y="13" width="10" height="5" rx="2" fill="#ca8a04"/>
      <rect x="13" y="19" width="18" height="12" rx="2" fill="#fef08a"/>
    </g>

    <!-- Microsoft Edge -->
    <g transform="translate(186, 0)">
      <circle cx="22" cy="22" r="11" fill="#0284c7"/>
      <path d="M 16 26 C 18 30, 26 31, 28 27 C 29 23, 24 20, 20 22 C 16 23, 14 17, 21 14 C 27 12, 31 16, 31 20" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Microsoft Word Icon in Taskbar -->
    <g transform="translate(232, 0)">
      <rect x="12" y="11" width="20" height="22" rx="3" fill="#185abd"/>
      <text x="22" y="27" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">W</text>
    </g>
  </g>

  <!-- Right System Tray -->
  <g transform="translate(1720, 1042)">
    <!-- Tray Arrow -->
    <path d="M 0 16 L 5 11 L 10 16" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <!-- Wifi -->
    <path d="M 30 20 A 12 12 0 0 1 46 20 M 34 23 A 7 7 0 0 1 42 23 M 38 25 A 2 2 0 0 1 38 25" stroke="#cbd5e1" stroke-width="2" fill="none" stroke-linecap="round"/>
    <!-- Volume -->
    <path d="M 58 16 L 62 16 L 66 12 L 66 26 L 62 22 L 58 22 Z" fill="#cbd5e1"/>
    <path d="M 69 16 A 4 4 0 0 1 69 22" stroke="#cbd5e1" stroke-width="2" fill="none"/>
    <!-- Date & Time -->
    <text x="110" y="14" fill="#e2e8f0" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="end">10:45</text>
    <text x="110" y="27" fill="#94a3b8" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="end">14/09/2026</text>
  </g>
</svg>
