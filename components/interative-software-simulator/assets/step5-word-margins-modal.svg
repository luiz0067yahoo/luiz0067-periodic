<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="modal-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Word Background (Dimmed) -->
  <rect width="1920" height="1080" fill="#edebe9"/>
  <rect x="0" y="0" width="1920" height="42" fill="#185abd"/>
  <rect x="0" y="42" width="1920" height="38" fill="#f3f2f1"/>
  <rect x="0" y="80" width="1920" height="98" fill="#ffffff"/>
  <rect x="560" y="220" width="800" height="820" fill="#ffffff" stroke="#d2d0ce"/>
  <!-- Backdrop Overlay -->
  <rect width="1920" height="1080" fill="#000000" fill-opacity="0.35"/>

  <!-- CONFIGURAR PÁGINA MODAL DIALOG -->
  <g id="page-setup-modal" transform="translate(650, 220)" filter="url(#modal-shadow)">
    <!-- Modal Container -->
    <rect width="620" height="620" rx="8" fill="#f9f9f9" stroke="#b8b8b8" stroke-width="1"/>

    <!-- Modal Titlebar -->
    <path d="M 0 8 Q 0 0 8 0 L 612 0 Q 620 0 620 8 L 620 36 L 0 36 Z" fill="#ffffff"/>
    <text x="18" y="24" fill="#1f1f1f" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Configurar Página</text>
    <!-- Close X -->
    <line x1="595" y1="12" x2="607" y2="24" stroke="#605e5c" stroke-width="1.5"/>
    <line x1="607" y1="12" x2="595" y2="24" stroke="#605e5c" stroke-width="1.5"/>
    <!-- Help ? -->
    <text x="575" y="24" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold">?</text>
    <line x1="0" y1="36" x2="620" y2="36" stroke="#e1dfdd" stroke-width="1"/>

    <!-- Tabs: Margens, Papel, Layout -->
    <g transform="translate(18, 50)">
      <!-- Tab Margens (Active) -->
      <rect x="0" y="0" width="85" height="28" rx="3" fill="#f9f9f9" stroke="#b8b8b8" stroke-width="1"/>
      <rect x="1" y="26" width="83" height="4" fill="#f9f9f9"/>
      <text x="42" y="19" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600" text-anchor="middle">Margens</text>
      <!-- Tab Papel -->
      <rect x="86" y="2" width="75" height="26" rx="3" fill="#f0f0f0" stroke="#dcdcdc" stroke-width="1"/>
      <text x="123" y="19" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Papel</text>
      <!-- Tab Layout -->
      <rect x="162" y="2" width="75" height="26" rx="3" fill="#f0f0f0" stroke="#dcdcdc" stroke-width="1"/>
      <text x="199" y="19" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Layout</text>
    </g>

    <!-- Tab Content Border Box -->
    <rect x="18" y="78" width="584" height="480" rx="3" fill="#ffffff" stroke="#b8b8b8" stroke-width="1"/>

    <!-- Group: Margens -->
    <g transform="translate(36, 95)">
      <!-- Group border line & Title -->
      <text x="10" y="8" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="bold">Margens (Padrão ABNT: Sup: 3cm, Esq: 3cm, Inf: 2cm, Dir: 2cm)</text>
      <line x1="0" y1="18" x2="548" y2="18" stroke="#e1dfdd" stroke-width="1"/>

      <!-- Input 1: Superior (HOTSPOT TARGET 1) -->
      <text x="10" y="52" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12">Superior:</text>
      <rect id="input-superior-box" x="80" y="34" width="105" height="28" rx="2" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
      <text x="90" y="53" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">3 cm</text>
      <!-- Spin buttons -->
      <rect x="165" y="34" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 172 43 L 175 39 L 178 43" stroke="#605e5c" stroke-width="1" fill="none"/>
      <rect x="165" y="48" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 172 53 L 175 57 L 178 53" stroke="#605e5c" stroke-width="1" fill="none"/>

      <!-- Input 2: Esquerda (HOTSPOT TARGET 2) -->
      <text x="10" y="96" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12">Esquerda:</text>
      <rect id="input-esquerda-box" x="80" y="78" width="105" height="28" rx="2" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
      <text x="90" y="97" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">3 cm</text>
      <rect x="165" y="78" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 172 87 L 175 83 L 178 87" stroke="#605e5c" stroke-width="1" fill="none"/>
      <rect x="165" y="92" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 172 97 L 175 101 L 178 97" stroke="#605e5c" stroke-width="1" fill="none"/>

      <!-- Input 3: Inferior (HOTSPOT TARGET 3) -->
      <text x="280" y="52" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12">Inferior:</text>
      <rect id="input-inferior-box" x="350" y="34" width="105" height="28" rx="2" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
      <text x="360" y="53" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">2 cm</text>
      <rect x="435" y="34" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 442 43 L 445 39 L 448 43" stroke="#605e5c" stroke-width="1" fill="none"/>
      <rect x="435" y="48" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 442 53 L 445 57 L 448 53" stroke="#605e5c" stroke-width="1" fill="none"/>

      <!-- Input 4: Direita (HOTSPOT TARGET 4) -->
      <text x="280" y="96" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12">Direita:</text>
      <rect id="input-direita-box" x="350" y="78" width="105" height="28" rx="2" fill="#ffffff" stroke="#0078d4" stroke-width="1.5"/>
      <text x="360" y="97" fill="#64748b" font-family="'Segoe UI', sans-serif" font-size="13">2 cm</text>
      <rect x="435" y="78" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 442 87 L 445 83 L 448 87" stroke="#605e5c" stroke-width="1" fill="none"/>
      <rect x="435" y="92" width="20" height="14" fill="#f3f2f1" stroke="#d2d0ce" stroke-width="0.5"/>
      <path d="M 442 97 L 445 101 L 448 97" stroke="#605e5c" stroke-width="1" fill="none"/>

      <!-- Medianiz -->
      <text x="10" y="140" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="12">Medianiz:</text>
      <rect x="80" y="122" width="105" height="28" rx="2" fill="#faf9f8" stroke="#d2d0ce" stroke-width="1"/>
      <text x="90" y="141" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">0 cm</text>
    </g>

    <!-- Group: Orientação -->
    <g transform="translate(36, 275)">
      <text x="10" y="8" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Orientação</text>
      <line x1="0" y1="18" x2="548" y2="18" stroke="#e1dfdd" stroke-width="1"/>
      <!-- Retrato (Selected) -->
      <g transform="translate(40, 30)">
        <rect width="60" height="65" rx="3" fill="#eff6fc" stroke="#0078d4" stroke-width="1.5"/>
        <rect x="18" y="12" width="24" height="34" rx="1" fill="#ffffff" stroke="#0078d4" stroke-width="1"/>
        <text x="30" y="60" fill="#0078d4" font-family="'Segoe UI', sans-serif" font-size="10" font-weight="600" text-anchor="middle">Retrato</text>
      </g>
      <!-- Paisagem -->
      <g transform="translate(130, 30)">
        <rect width="60" height="65" rx="3" fill="transparent" stroke="#d2d0ce" stroke-width="1"/>
        <rect x="12" y="20" width="36" height="24" rx="1" fill="#ffffff" stroke="#605e5c" stroke-width="1"/>
        <text x="30" y="60" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="10" text-anchor="middle">Paisagem</text>
      </g>
    </g>

    <!-- Visualização Prévia -->
    <g transform="translate(36, 400)">
      <text x="10" y="8" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12" font-weight="600">Visualização</text>
      <line x1="0" y1="18" x2="548" y2="18" stroke="#e1dfdd" stroke-width="1"/>
      <rect x="40" y="28" width="50" height="65" rx="2" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>
      <text x="110" y="62" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="12">Aplicar a: No documento inteiro</text>
    </g>

    <!-- Footer Buttons (HOTSPOT TARGET: OK BUTTON) -->
    <g transform="translate(18, 570)">
      <rect x="0" y="0" width="140" height="32" rx="3" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
      <text x="70" y="21" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="12" text-anchor="middle">Definir como Padrão</text>

      <!-- OK BUTTON (HOTSPOT TARGET) -->
      <g id="btn-ok-target">
        <rect x="380" y="0" width="95" height="32" rx="3" fill="#0078d4" stroke="#0078d4" stroke-width="1"/>
        <text x="427" y="21" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">OK</text>
      </g>

      <!-- CANCEL BUTTON -->
      <rect x="488" y="0" width="95" height="32" rx="3" fill="#ffffff" stroke="#8a8886" stroke-width="1"/>
      <text x="535" y="21" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="13" text-anchor="middle">Cancelar</text>
    </g>
  </g>
</svg>
