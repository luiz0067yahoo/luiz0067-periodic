<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <filter id="dropdown-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Word Background -->
  <rect width="1920" height="1080" fill="#edebe9"/>

  <!-- TITLE BAR -->
  <rect x="0" y="0" width="1920" height="42" fill="#185abd"/>
  <rect x="15" y="10" width="22" height="22" rx="3" fill="#ffffff"/>
  <text x="26" y="27" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="bold" text-anchor="middle">W</text>
  <text x="960" y="26" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600" text-anchor="middle">Documento1 - Microsoft Word</text>
  <g transform="translate(1780, 0)">
    <line x1="18" y1="21" x2="28" y2="21" stroke="#ffffff" stroke-width="1.5"/>
    <rect x="62" y="16" width="11" height="11" stroke="#ffffff" stroke-width="1.5" fill="none"/>
    <rect x="90" y="0" width="48" height="42" fill="#c42b1c"/>
    <line x1="108" y1="16" x2="120" y2="28" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="120" y1="16" x2="108" y2="28" stroke="#ffffff" stroke-width="1.5"/>
  </g>

  <!-- RIBBON TABS BAR -->
  <rect x="0" y="42" width="1920" height="38" fill="#f3f2f1" stroke="#e1dfdd" stroke-width="1"/>
  <text x="30" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Arquivo</text>
  <text x="100" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Página Inicial</text>
  <text x="210" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Inserir</text>
  <text x="280" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Desenhar</text>
  <text x="365" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Design</text>

  <!-- Active Tab: Layout -->
  <g>
    <rect x="430" y="44" width="75" height="36" fill="#ffffff"/>
    <text x="467" y="66" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700" text-anchor="middle">Layout</text>
    <rect x="430" y="77" width="75" height="3" fill="#185abd"/>
  </g>

  <text x="535" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Referências</text>
  <text x="640" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Correspondências</text>
  <text x="775" y="66" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="13">Revisão</text>

  <!-- RIBBON COMMANDS TOOLBAR (Layout Content) -->
  <rect x="0" y="80" width="1920" height="98" fill="#ffffff" stroke="#e1dfdd" stroke-width="1"/>

  <!-- Configurar Página Group -->
  <!-- Margens Button (Active / Selected) -->
  <g transform="translate(20, 86)">
    <rect x="0" y="0" width="76" height="78" rx="4" fill="#cfe4fa" stroke="#185abd" stroke-width="1"/>
    <!-- Margins Icon -->
    <rect x="24" y="10" width="28" height="36" rx="2" fill="#ffffff" stroke="#185abd" stroke-width="1.5"/>
    <rect x="30" y="16" width="16" height="24" stroke="#185abd" stroke-width="1" stroke-dasharray="2,2" fill="none"/>
    <text x="38" y="58" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="11" font-weight="600" text-anchor="middle">Margens</text>
    <path d="M 35 65 L 38 68 L 41 65" stroke="#185abd" stroke-width="1.5" fill="none"/>
  </g>

  <!-- Orientação Button -->
  <g transform="translate(105, 86)">
    <rect x="18" y="10" width="24" height="34" rx="2" fill="none" stroke="#605e5c" stroke-width="1.5"/>
    <text x="30" y="58" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Orientação</text>
  </g>

  <!-- Tamanho Button -->
  <g transform="translate(180, 86)">
    <rect x="18" y="10" width="26" height="34" rx="2" fill="none" stroke="#605e5c" stroke-width="1.5"/>
    <text x="31" y="58" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Tamanho</text>
  </g>

  <!-- Colunas Button -->
  <g transform="translate(255, 86)">
    <rect x="16" y="12" width="10" height="30" fill="#a19f9d"/>
    <rect x="30" y="12" width="10" height="30" fill="#a19f9d"/>
    <text x="28" y="58" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Colunas</text>
  </g>
  <text x="170" y="172" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11" text-anchor="middle">Configurar Página</text>
  <line x1="330" y1="88" x2="330" y2="168" stroke="#e1dfdd" stroke-width="1"/>

  <!-- Parágrafo Group -->
  <g transform="translate(350, 95)">
    <text x="0" y="16" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="11">Recuar À esquerda: 0 cm</text>
    <text x="0" y="42" fill="#323130" font-family="'Segoe UI', sans-serif" font-size="11">Recuar À direita: 0 cm</text>
    <text x="60" y="77" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Parágrafo</text>
  </g>
  <line x1="530" y1="88" x2="530" y2="168" stroke="#e1dfdd" stroke-width="1"/>

  <!-- A4 Page in Background -->
  <rect x="560" y="220" width="800" height="820" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>

  <!-- MARGENS DROPDOWN MENU FLYOUT (Open below Margens button) -->
  <g id="margens-dropdown" transform="translate(20, 168)" filter="url(#dropdown-shadow)">
    <rect width="320" height="380" rx="6" fill="#ffffff" stroke="#d2d0ce" stroke-width="1"/>
    
    <!-- Option: Normal -->
    <g transform="translate(10, 15)">
      <rect width="300" height="60" rx="4" fill="#f3f2f1" fill-opacity="0.4"/>
      <rect x="12" y="14" width="22" height="30" stroke="#185abd" stroke-width="1.5" fill="none"/>
      <text x="45" y="24" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Normal</text>
      <text x="45" y="42" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Superior: 2,5 cm  |  Inferior: 2,5 cm</text>
      <text x="45" y="55" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Esquerda: 3 cm   |  Direita: 3 cm</text>
    </g>

    <!-- Option: Estreita -->
    <g transform="translate(10, 85)">
      <rect width="300" height="60" rx="4" fill="transparent"/>
      <rect x="12" y="14" width="22" height="30" stroke="#605e5c" stroke-width="1.5" fill="none"/>
      <text x="45" y="24" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Estreita</text>
      <text x="45" y="42" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Superior: 1,27 cm  |  Inferior: 1,27 cm</text>
      <text x="45" y="55" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Esquerda: 1,27 cm  |  Direita: 1,27 cm</text>
    </g>

    <!-- Option: Moderada -->
    <g transform="translate(10, 155)">
      <rect width="300" height="60" rx="4" fill="transparent"/>
      <rect x="12" y="14" width="22" height="30" stroke="#605e5c" stroke-width="1.5" fill="none"/>
      <text x="45" y="24" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Moderada</text>
      <text x="45" y="42" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Superior: 2,54 cm  |  Inferior: 2,54 cm</text>
      <text x="45" y="55" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Esquerda: 1,91 cm  |  Direita: 1,91 cm</text>
    </g>

    <!-- Option: Larga -->
    <g transform="translate(10, 225)">
      <rect width="300" height="60" rx="4" fill="transparent"/>
      <rect x="12" y="14" width="22" height="30" stroke="#605e5c" stroke-width="1.5" fill="none"/>
      <text x="45" y="24" fill="#201f1e" font-family="'Segoe UI', sans-serif" font-size="13" font-weight="600">Larga</text>
      <text x="45" y="42" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Superior: 2,54 cm  |  Inferior: 2,54 cm</text>
      <text x="45" y="55" fill="#605e5c" font-family="'Segoe UI', sans-serif" font-size="11">Esquerda: 5,08 cm  |  Direita: 5,08 cm</text>
    </g>

    <line x1="10" y1="300" x2="310" y2="300" stroke="#e1dfdd" stroke-width="1"/>

    <!-- TARGET HOTSPOT: Margens Personalizadas... -->
    <g id="target-custom-margins" transform="translate(10, 312)">
      <rect width="300" height="52" rx="4" fill="#e8f2fd" stroke="#185abd" stroke-width="1.5"/>
      <rect x="16" y="14" width="20" height="24" stroke="#185abd" stroke-width="2" fill="none"/>
      <text x="48" y="32" fill="#185abd" font-family="'Segoe UI', sans-serif" font-size="14" font-weight="700">Margens Personalizadas...</text>
    </g>
  </g>

  <!-- STATUS BAR -->
  <rect x="0" y="1052" width="1920" height="28" fill="#185abd"/>
  <text x="25" y="1070" fill="#ffffff" font-family="'Segoe UI', sans-serif" font-size="12">Página 1 de 1</text>
</svg>
