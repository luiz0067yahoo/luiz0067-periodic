<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800">
  <rect width="1200" height="800" fill="#f8f9fa"/>
  <rect width="1200" height="50" fill="#ffffff" stroke="#e0e0e0"/>
  <text x="30" y="32" fill="#1e1e1e" font-family="-apple-system, sans-serif" font-size="16" font-weight="700">Periodic Image Editor — Aba 2: Zoom e Rotação</text>
  
  <rect x="50" y="80" width="700" height="670" rx="12" fill="#ffffff" stroke="#e9ecef" stroke-width="1"/>
  <rect x="80" y="110" width="640" height="450" rx="12" fill="#1e293b"/>
  <circle cx="400" cy="335" r="160" fill="#3b82f6" opacity="0.6"/>
  <text x="320" y="340" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="18" font-weight="600">Zoom: 140% | Rotação: 45°</text>

  <rect x="780" y="80" width="370" height="670" rx="8" fill="#ffffff" stroke="#e0e0e0"/>
  <rect x="780" y="80" width="370" height="45" fill="#f8f9fa" stroke="#e0e0e0"/>
  <text x="800" y="108" fill="#6c757d" font-family="-apple-system, sans-serif" font-size="13">Mídia</text>
  <text x="880" y="108" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Zoom e Rotação</text>
  <text x="1030" y="108" fill="#6c757d" font-family="-apple-system, sans-serif" font-size="13">Posição X/Y</text>

  <text x="805" y="160" fill="#212529" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Fator de Zoom: 1.4x (140%)</text>
  <line x1="805" y1="185" x2="1125" y2="185" stroke="#ced4da" stroke-width="4"/>
  <circle cx="940" cy="185" r="8" fill="#0d6efd"/>

  <text x="805" y="240" fill="#212529" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Ângulo de Giro: 45°</text>
  <line x1="805" y1="265" x2="1125" y2="265" stroke="#ced4da" stroke-width="4"/>
  <circle cx="860" cy="265" r="8" fill="#0d6efd"/>

  <rect x="805" y="300" width="95" height="34" rx="4" fill="#f8f9fa" stroke="#ced4da"/>
  <text x="825" y="322" fill="#212529" font-family="-apple-system, sans-serif" font-size="12">↺ -90°</text>

  <rect x="915" y="300" width="95" height="34" rx="4" fill="#f8f9fa" stroke="#ced4da"/>
