<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8e24aa" />
      <stop offset="100%" stop-color="#512da8" />
    </linearGradient>
    <linearGradient id="playGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff4081" />
      <stop offset="100%" stop-color="#e91e63" />
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#1e1b4b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Base do Player -->
  <rect x="12" y="22" width="104" height="76" rx="16" fill="url(#bgGrad)" filter="url(#dropShadow)" />

  <!-- Tela Interna com Efeito Glass -->
  <rect x="20" y="30" width="88" height="60" rx="10" fill="#0f172a" fill-opacity="0.85" stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Detalhe superior da barra do player -->
  <circle cx="32" cy="38" r="3" fill="#ff5252" />
  <circle cx="41" cy="38" r="3" fill="#fb8c00" />
  <circle cx="50" cy="38" r="3" fill="#4caf50" />

  <!-- Botão Play Central Estilizado -->
  <path d="M54 48 L78 60 L54 72 Z" fill="url(#playGrad)" stroke="#ffffff" stroke-width="1.5" stroke-linejoin="round" />

  <!-- Barra de progresso e controles inferiores -->
  <rect x="28" y="78" width="72" height="3.5" rx="1.75" fill="#334155" />
  <rect x="28" y="78" width="34" height="3.5" rx="1.75" fill="#ff4081" />
  <circle cx="62" cy="79.75" r="3" fill="#ffffff" />

  <!-- Suporte e base de monitor -->
  <path d="M56 98 L50 108 L78 108 L72 98 Z" fill="#64748b" />
  <rect x="42" y="108" width="44" height="4" rx="2" fill="#475569" />
</svg>
