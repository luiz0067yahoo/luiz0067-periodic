<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.08"/>
    </filter>
  </defs>
  <!-- Background subtle card -->
  <rect x="8" y="8" width="112" height="112" rx="24" fill="#ffffff" stroke="#e2d2be" stroke-width="2.5" filter="url(#shadow)"/>
  
  <!-- Torus Slices -->
  <!-- Slice 1: Coral Red (Top Right) -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#f85a68" stroke-width="12"
          stroke-dasharray="100 120" stroke-dashoffset="0"
          transform="rotate(-72 64 64)" stroke-linecap="butt"/>
  
  <!-- Slice 2: Purple Violet (Bottom) -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#7e42d7" stroke-width="12"
          stroke-dasharray="58 160" stroke-dashoffset="-104"
          transform="rotate(-72 64 64)" stroke-linecap="butt"/>
          
  <!-- Slice 3: Vibrant Green (Left) -->
  <circle cx="64" cy="64" r="34" fill="none" stroke="#00b038" stroke-width="12"
          stroke-dasharray="52 170" stroke-dashoffset="-166"
          transform="rotate(-72 64 64)" stroke-linecap="butt"/>

  <!-- Center Text -->
  <text x="64" y="61" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="700" fill="#111827">256</text>
  <text x="64" y="72" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="5.5" font-weight="800" letter-spacing="0.8" fill="#1f2937">BANNED</text>
</svg>
