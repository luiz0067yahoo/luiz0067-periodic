<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" />
      <stop offset="100%" stop-color="#60a5fa" />
    </linearGradient>
  </defs>

  <!-- Card Background -->
  <rect x="4" y="4" width="120" height="120" rx="26" fill="url(#bgGrad)" />

  <!-- Torus Arc in upper right -->
  <circle cx="90" cy="38" r="19" fill="none" stroke="#334155" stroke-width="6" />
  <circle cx="90" cy="38" r="19" fill="none" stroke="#f85a68" stroke-width="6" stroke-dasharray="40 80" stroke-linecap="round" />
  <circle cx="90" cy="38" r="19" fill="none" stroke="#00b038" stroke-width="6" stroke-dasharray="25 95" stroke-dashoffset="-45" stroke-linecap="round" />
  <circle cx="90" cy="38" r="19" fill="none" stroke="#7e42d7" stroke-width="6" stroke-dasharray="30 90" stroke-dashoffset="-75" stroke-linecap="round" />

  <!-- Line & Bar Grid Lines -->
  <line x1="20" y1="58" x2="68" y2="58" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="20" y1="78" x2="108" y2="78" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />
  <line x1="20" y1="98" x2="108" y2="98" stroke="#334155" stroke-width="1.2" stroke-dasharray="3 3" />

  <!-- Rounded Bars -->
  <rect x="24" y="74" width="9" height="24" rx="4.5" fill="url(#barGrad)" opacity="0.85" />
  <rect x="40" y="52" width="9" height="46" rx="4.5" fill="url(#barGrad)" opacity="0.85" />
  <rect x="56" y="66" width="9" height="32" rx="4.5" fill="url(#barGrad)" opacity="0.85" />
  <rect x="72" y="44" width="9" height="54" rx="4.5" fill="url(#barGrad)" opacity="0.85" />
  <rect x="88" y="60" width="9" height="38" rx="4.5" fill="url(#barGrad)" opacity="0.85" />

  <!-- Overlay Line & Dots -->
  <polyline points="28.5,74 44.5,52 60.5,66 76.5,44 92.5,60" fill="none" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />
  
  <circle cx="28.5" cy="74" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <circle cx="44.5" cy="52" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <circle cx="60.5" cy="66" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <circle cx="76.5" cy="44" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
  <circle cx="92.5" cy="60" r="3" fill="#ffffff" stroke="#38bdf8" stroke-width="2" />
</svg>
