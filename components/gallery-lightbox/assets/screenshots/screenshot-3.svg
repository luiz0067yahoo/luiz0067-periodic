<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <rect width="800" height="650" fill="#f8fafc"/>
  <rect x="180" y="20" width="440" height="610" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Abas do Topo -->
  <rect x="180" y="20" width="440" height="48" rx="8" fill="#f1f5f9"/>
  <rect x="320" y="20" width="160" height="48" fill="#ffffff"/>
  <line x1="320" y1="68" x2="480" y2="68" stroke="#0d6efd" stroke-width="3"/>
  <text x="250" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Imagens</text>
  <text x="400" y="50" text-anchor="middle" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Layout da Grade</text>
  <text x="550" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Lightbox</text>

  <!-- Conteúdo da Aba Layout -->
  <text x="210" y="105" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Layout e Responsividade da Grade</text>

  <!-- Slider Desktop -->
  <text x="210" y="145" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Colunas no Desktop (Telas Grandes)</text>
  <rect x="210" y="160" width="380" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="210" y="160" width="250" height="6" rx="3" fill="#0d6efd"/>
  <circle cx="460" cy="163" r="9" fill="#0d6efd"/>
  <text x="560" y="168" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">4 col</text>
  <text x="210" y="185" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Padrão recomendado: 3 ou 4 colunas.</text>

  <!-- Slider Tablet -->
  <text x="210" y="225" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Colunas no Tablet (Telas Médias)</text>
  <rect x="210" y="240" width="380" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="210" y="240" width="190" height="6" rx="3" fill="#0d6efd"/>
  <circle cx="400" cy="243" r="9" fill="#0d6efd"/>
  <text x="560" y="248" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">2 col</text>
  <text x="210" y="265" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Padrão recomendado: 2 colunas.</text>

  <!-- Slider Mobile -->
  <text x="210" y="305" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Colunas no Celular (Mobile)</text>
  <rect x="210" y="320" width="380" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="210" y="320" width="120" height="6" rx="3" fill="#0d6efd"/>
  <circle cx="330" cy="323" r="9" fill="#0d6efd"/>
  <text x="560" y="328" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="14" font-weight="bold">1 col</text>
  <text x="210" y="345" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Padrão recomendado: 1 ou 2 colunas.</text>

  <line x1="210" y1="375" x2="590" y2="375" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Seletor de Espaçamento -->
  <text x="210" y="415" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Espaçamento da Grade (Bootstrap Gap)</text>
  <rect x="210" y="428" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="225" y="452" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13">Médio (g-3 - Padrão)</text>
  <text x="565" y="452" fill="#64748b" font-size="12">▼</text>
  <text x="210" y="482" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Define a distância entre as fotos na grade.</text>

  <!-- Seletor de Proporção -->
  <text x="210" y="525" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Proporção das Miniaturas (Corte da Imagem)</text>
  <rect x="210" y="538" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="225" y="562" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13">Quadrado 1:1 (Padrão)</text>
  <text x="565" y="562" fill="#64748b" font-size="12">▼</text>
  <text x="210" y="592" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Formato visual de exibição de cada foto na grade.</text>
</svg>
