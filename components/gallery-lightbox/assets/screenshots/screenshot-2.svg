<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <!-- Fundo do Painel Lateral -->
  <rect width="800" height="650" fill="#f8fafc"/>
  <rect x="180" y="20" width="440" height="610" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Abas do Topo -->
  <rect x="180" y="20" width="440" height="48" rx="8" fill="#f1f5f9"/>
  <rect x="180" y="20" width="160" height="48" fill="#ffffff"/>
  <line x1="180" y1="68" x2="340" y2="68" stroke="#0d6efd" stroke-width="3"/>
  <text x="260" y="50" text-anchor="middle" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Galeria de Imagens</text>

  <text x="400" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Layout da Grade</text>
  <text x="540" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Lightbox</text>

  <!-- Aviso de Total de Fotos -->
  <rect x="205" y="85" width="390" height="38" rx="4" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="225" y="109" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="13">Total de fotos na galeria: <tspan font-weight="bold">8 fotos</tspan></text>

  <!-- Botões de Ação de Mídia -->
  <rect x="205" y="135" width="390" height="36" rx="4" fill="#0d6efd"/>
  <text x="400" y="158" text-anchor="middle" fill="#ffffff" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">+ Adicionar Mais Imagens</text>

  <rect x="205" y="180" width="390" height="34" rx="4" fill="#f8fafc" stroke="#cbd5e1"/>
  <text x="400" y="202" text-anchor="middle" fill="#334155" font-family="-apple-system, sans-serif" font-size="12">Substituir / Reabrir Biblioteca</text>

  <!-- Box de Edição da Foto Ativa -->
  <rect x="205" y="230" width="390" height="380" rx="6" fill="#f8fafc" stroke="#e2e8f0"/>
  <text x="225" y="255" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Editando Foto #3</text>

  <!-- Botões de Ordenação -->
  <rect x="490" y="240" width="28" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="504" y="256" text-anchor="middle" fill="#334155" font-size="12">←</text>
  <rect x="525" y="240" width="28" height="24" rx="3" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="539" y="256" text-anchor="middle" fill="#334155" font-size="12">→</text>
  <rect x="560" y="240" width="24" height="24" rx="3" fill="#fee2e2" stroke="#fca5a5"/>
  <text x="572" y="256" text-anchor="middle" fill="#dc2626" font-size="12">✕</text>

  <!-- Miniatura da Imagem -->
  <rect x="335" y="275" width="130" height="85" rx="4" fill="#3b82f6"/>

  <!-- Campo Título -->
  <text x="225" y="385" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Título da Imagem</text>
  <rect x="225" y="395" width="350" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="235" y="416" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="12">Cordilheira dos Andes ao Entardecer</text>

  <!-- Campo Legenda -->
  <text x="225" y="450" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Legenda Descritiva</text>
  <rect x="225" y="460" width="350" height="60" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="235" y="482" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">Fotografia panorâmica tirada a 4.200m</text>
  <text x="235" y="500" fill="#475569" font-family="-apple-system, sans-serif" font-size="12">com iluminação dourada e céu limpo.</text>

  <!-- Campo Alt -->
  <text x="225" y="542" fill="#334155" font-family="-apple-system, sans-serif" font-size="12" font-weight="600">Texto Alternativo (Alt)</text>
  <rect x="225" y="552" width="350" height="32" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="235" y="573" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="12">Vista das montanhas nevadas ao entardecer</text>
</svg>
