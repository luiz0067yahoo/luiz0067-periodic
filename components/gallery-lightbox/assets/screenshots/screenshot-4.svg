<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 650" width="800" height="650">
  <rect width="800" height="650" fill="#f8fafc"/>
  <rect x="180" y="20" width="440" height="610" rx="8" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>

  <!-- Abas do Topo -->
  <rect x="180" y="20" width="440" height="48" rx="8" fill="#f1f5f9"/>
  <rect x="460" y="20" width="160" height="48" fill="#ffffff"/>
  <line x1="460" y1="68" x2="620" y2="68" stroke="#0d6efd" stroke-width="3"/>
  <text x="250" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Imagens</text>
  <text x="390" y="50" text-anchor="middle" fill="#64748b" font-family="-apple-system, sans-serif" font-size="13" font-weight="500">Grade</text>
  <text x="540" y="50" text-anchor="middle" fill="#0d6efd" font-family="-apple-system, sans-serif" font-size="13" font-weight="700">Lightbox</text>

  <!-- Conteúdo da Aba Lightbox -->
  <text x="210" y="105" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="15" font-weight="700">Configurações do Lightbox em Tela Cheia</text>

  <!-- Seletor de Tema -->
  <text x="210" y="145" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Tema Visual do Lightbox</text>
  <rect x="210" y="158" width="380" height="38" rx="4" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="225" y="182" fill="#0f172a" font-family="-apple-system, sans-serif" font-size="13">Escuro Elegante (Dark - Padrão)</text>
  <text x="565" y="182" fill="#64748b" font-size="12">▼</text>
  <text x="210" y="212" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Escolha entre fundo escuro profundo ou claro moderno.</text>

  <!-- Toggle Legendas -->
  <g transform="translate(210, 240)">
    <text x="0" y="20" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Exibir Títulos e Legendas</text>
    <rect x="330" y="5" width="48" height="24" rx="12" fill="#0d6efd"/>
    <circle cx="365" cy="17" r="9" fill="#ffffff"/>
    <text x="0" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Mostra textos explicativos na galeria e no lightbox.</text>
  </g>

  <!-- Toggle Miniaturas -->
  <g transform="translate(210, 310)">
    <text x="0" y="20" fill="#334155" font-family="-apple-system, sans-serif" font-size="13" font-weight="600">Barra de Miniaturas Inferior</text>
    <rect x="330" y="5" width="48" height="24" rx="12" fill="#0d6efd"/>
    <circle cx="365" cy="17" r="9" fill="#ffffff"/>
    <text x="0" y="42" fill="#64748b" font-family="-apple-system, sans-serif" font-size="11">Habilita carrossel de miniaturas deslizantes na base do popup.</text>
  </g>

  <line x1="210" y1="380" x2="590" y2="380" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Caixa de Recursos e Atalhos -->
  <rect x="210" y="405" width="380" height="200" rx="6" fill="#eff6ff" stroke="#bfdbfe"/>
  <text x="230" y="435" fill="#1e40af" font-family="-apple-system, sans-serif" font-size="13" font-weight="bold">Recursos de Navegação Inclusos:</text>

  <circle cx="238" cy="465" r="3" fill="#3b82f6"/>
  <text x="250" y="469" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="12">Navegação circular pelas setas laterais</text>

  <circle cx="238" cy="495" r="3" fill="#3b82f6"/>
  <text x="250" y="499" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="12">Atalhos de teclado: [←] Anterior, [→] Próxima, [Esc] Sair</text>

  <circle cx="238" cy="525" r="3" fill="#3b82f6"/>
  <text x="250" y="529" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="12">Zoom interativo com cursor panorâmico</text>

  <circle cx="238" cy="555" r="3" fill="#3b82f6"/>
  <text x="250" y="559" fill="#1e3a8a" font-family="-apple-system, sans-serif" font-size="12">Suporte a gestos touch (deslize horizontal no mobile)</text>
</svg>
