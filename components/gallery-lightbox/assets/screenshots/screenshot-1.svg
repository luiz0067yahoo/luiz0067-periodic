<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="1200" height="675">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d"/>
      <stop offset="100%" stop-color="#151f38"/>
    </linearGradient>
    <linearGradient id="imgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- Fundo com gradiente elegante -->
  <rect width="1200" height="675" fill="url(#bgGrad)"/>

  <!-- Barra Superior do Lightbox -->
  <rect x="0" y="0" width="1200" height="60" fill="#0d1117" fill-opacity="0.9"/>
  <line x1="0" y1="60" x2="1200" y2="60" stroke="#30363d" stroke-width="1"/>

  <!-- Contador de Fotos -->
  <text x="35" y="38" fill="#58a6ff" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="700">3 / 8</text>

  <!-- Título Central -->
  <text x="600" y="38" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="18" font-weight="600">Fotografia Panorâmica da Cordilheira dos Andes</text>

  <!-- Botões de Ação Topo Direito -->
  <circle cx="1115" cy="30" r="18" fill="#21262d"/>
  <text x="1115" y="35" text-anchor="middle" fill="#c9d1d9" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14">🔍+</text>
  <circle cx="1160" cy="30" r="18" fill="#21262d"/>
  <text x="1160" y="36" text-anchor="middle" fill="#f85149" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="bold">✕</text>

  <!-- Palco Central / Imagem em Alta Resolução -->
  <rect x="220" y="90" width="760" height="420" rx="8" fill="url(#imgGrad1)" filter="url(#dropShadow)"/>

  <!-- Elementos artísticos ilustrando a fotografia -->
  <path d="M 220 440 L 400 240 L 520 340 L 680 180 L 840 360 L 980 280 L 980 510 L 220 510 Z" fill="#0f172a" fill-opacity="0.45"/>
  <path d="M 220 470 L 350 360 L 540 450 L 760 310 L 980 430 L 980 510 L 220 510 Z" fill="#020617" fill-opacity="0.7"/>
  <circle cx="820" cy="180" r="38" fill="#fef08a" fill-opacity="0.8"/>

  <!-- Seta Anterior -->
  <circle cx="120" cy="300" r="26" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <path d="M 124 288 L 112 300 L 124 312" fill="none" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Seta Próxima -->
  <circle cx="1080" cy="300" r="26" fill="#161b22" stroke="#30363d" stroke-width="1"/>
  <path d="M 1076 288 L 1088 300 L 1076 312" fill="none" stroke="#f0f6fc" stroke-width="3" stroke-linecap="round"/>

  <!-- Barra Inferior -->
  <rect x="0" y="535" width="1200" height="140" fill="#0d1117" fill-opacity="0.95"/>
  <line x1="0" y1="535" x2="1200" y2="535" stroke="#30363d" stroke-width="1"/>

  <!-- Legenda -->
  <text x="600" y="562" text-anchor="middle" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="600">Cordilheira dos Andes ao entardecer</text>
  <text x="600" y="582" text-anchor="middle" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13">Capturada com lente grande angular a 4.200 metros de altitude.</text>

  <!-- Fita de Miniaturas Deslizantes -->
  <g transform="translate(370, 595)">
    <!-- Thumb 1 -->
    <rect x="0" y="0" width="52" height="52" rx="4" fill="#3b82f6" opacity="0.5"/>
    <!-- Thumb 2 -->
    <rect x="62" y="0" width="52" height="52" rx="4" fill="#10b981" opacity="0.5"/>
    <!-- Thumb 3 (Ativa) -->
    <rect x="124" y="0" width="52" height="52" rx="4" fill="url(#imgGrad1)" stroke="#58a6ff" stroke-width="3"/>
    <!-- Thumb 4 -->
    <rect x="186" y="0" width="52" height="52" rx="4" fill="#f59e0b" opacity="0.5"/>
    <!-- Thumb 5 -->
    <rect x="248" y="0" width="52" height="52" rx="4" fill="#ec4899" opacity="0.5"/>
    <!-- Thumb 6 -->
    <rect x="310" y="0" width="52" height="52" rx="4" fill="#8b5cf6" opacity="0.5"/>
    <!-- Thumb 7 -->
    <rect x="372" y="0" width="52" height="52" rx="4" fill="#06b6d4" opacity="0.5"/>
    <!-- Thumb 8 -->
    <rect x="434" y="0" width="52" height="52" rx="4" fill="#64748b" opacity="0.5"/>
  </g>
</svg>
